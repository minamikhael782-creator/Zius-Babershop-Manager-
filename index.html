<title>Zius Business Management System</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1d1b;--mut:#77736b;--line:#e3dfd6;--acc:#1f4d3a;--bad:#b3392f}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1f2226;--ink:#eee;--mut:#9aa0a6;--line:#33373d;--acc:#5fc59a;--bad:#ef7d72}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Cairo,Tahoma,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px;text-align:center}
h2{margin:0 0 4px;font-size:20px}
p{margin:0 0 16px;color:var(--mut);font-size:13px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);direction:ltr;text-align:center}
button{margin-top:12px;width:100%;font:inherit;padding:10px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#e{color:var(--bad);min-height:22px;margin-top:10px;font-size:13px}
</style>

function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
var pw=document.getElementById("pw"),go=document.getElementById("go"),er=document.getElementById("e");
async function unlock(){
  er.textContent="";
  if(!pw.value){er.textContent="اكتب كلمة السر";return}
  if(!(window.crypto&&crypto.subtle)){er.textContent="افتح الملف من رابط https أو من متصفح حديث";return}
  go.disabled=true;
  try{
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(DATA));
    var html=new TextDecoder().decode(buf);
    document.open();document.write(html);document.close();
  }catch(e){
    er.textContent="كلمة السر غير صحيحة";go.disabled=false;pw.select();
  }
}
go.onclick=unlock;
pw.onkeydown=function(e){if(e.key==="Enter")unlock()};
})();
